name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version committed on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SDK_LOCAL_SOURCE: '0'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the requested version
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(process.env.RELEASE_VERSION, JSON.parse(readFileSync('package.json', 'utf8')).version, 'Version input must match package.json');"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish the checked archive with npm trusted publishing
        run: |
          mkdir -p release-package
          npm pack --ignore-scripts --pack-destination release-package
          npm publish ./release-package/*.tgz --ignore-scripts --access public --provenance
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh release create "v${RELEASE_VERSION}" --target "$RELEASE_SHA" --title "Agent UI SDK ${RELEASE_VERSION}" --generate-notes
