name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    env:
      SDK_LOCAL_SOURCE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  browsers:
    runs-on: ubuntu-latest
    env:
      SDK_LOCAL_SOURCE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:lab:browser
      - run: npm run test:samples:browser
  native-smoke:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      SDK_LOCAL_SOURCE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build
      - run: npm run test:native:smoke
